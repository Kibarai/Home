<!doctype html>
<html lang="{{ page.lang | default: site.fallback_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include fonts.html %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/img/favicon-48.png' | relative_url }}" type="image/png" sizes="48x48">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  {%- if page.noindex %}
  <meta name="robots" content="noindex,follow">
  {%- endif -%}
  {%- seo -%}
  {%- include hreflang.html -%}
  {%- include schema.html -%}
  {%- feed_meta -%}
</head>
<body>
  {%- include header.html -%}
  <main id="main">
    {{ content }}
  </main>
  {%- include footer.html -%}
  {%- include cookie-banner.html -%}
</body>
</html>
