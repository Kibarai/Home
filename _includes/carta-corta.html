{%- comment -%}
  Estilos de las cartas cortas que acompañan al alta de la newsletter
  (/newsletter/mira-tu-correo/ y /confirmado/). Mismo aspecto que la carta
  de /newsletter/, en pequeño.
{%- endcomment -%}
<style>
:root {
  --bg:#ffffff; --bg-soft:#f6f9ff; --bg-accent:#e6eefa;
  --ink:#162c40; --ink-soft:#445067; --muted:#6b7488; --rule:#dbe2f0;
  --primary:#2d3663; --primary-dark:#1a2145; --secondary:#6e92ff; --tertiary:#00398f;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif-heading:"Poppins","Inter",system-ui,sans-serif;
  --radius:12px; --radius-lg:20px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); font-weight: 300; font-size: 16px; line-height: 1.7; color: var(--ink); background: var(--bg); }
h1,h2 { font-family: var(--serif-heading); font-weight: 600; color: var(--primary); line-height: 1.2; letter-spacing: -0.01em; }
.carta { max-width: 660px; margin: 0 auto; padding: 64px 24px 88px; }
.autor-top { display: flex; align-items: center; gap: 18px; margin-bottom: 40px; }
.autor-top img { width: 96px; height: 104px; object-fit: cover; object-position: center 20%; border-radius: var(--radius-lg); flex: none; }
.carta .autor-top p { margin: 0; }
.carta .autor-nombre { font-family: var(--serif-heading); font-weight: 600; color: var(--primary); font-size: 1.35rem; line-height: 1.2; }
.carta .autor-sub { font-size: 1rem; color: var(--secondary); font-weight: 500; letter-spacing: .02em; margin-top: 4px; }
.carta h1 { font-size: clamp(2rem, 4.4vw, 2.9rem); margin-bottom: 18px; }
.carta h2 { font-size: 1.45rem; margin: 44px 0 14px; }
.carta p, .carta li { font-size: 1.12rem; color: var(--ink-soft); }
.carta p + p { margin-top: 14px; }
.carta .golpe { font-family: var(--serif-heading); font-weight: 600; color: var(--primary); font-size: 1.3rem; }
.carta strong { font-weight: 600; color: var(--ink); }
.carta a { color: var(--tertiary); }
.carta ul { list-style: none; display: grid; gap: 14px; margin-top: 16px; }
.carta ul li { position: relative; padding-left: 26px; }
.carta ul li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 10px; height: 2px; background: var(--secondary); }
.carta ul + p { margin-top: 20px; }
.carta .pd { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--rule); font-size: 1rem; }
[hidden] { display: none !important; }
@media (max-width: 600px) {
  .carta { padding: 40px 20px 64px; }
  .carta p, .carta li { font-size: 1.05rem; }
}
</style>
