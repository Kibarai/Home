{%- comment -%}
  Sector salud: hojas de honorarios de varios profesionales llegando sueltas,
  y la liquidación de cada uno ya cuadrada dentro del sistema.
{%- endcomment -%}
<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="{{ site.data.i18n[page.lang].i18n.illustration_alt_salud }}">
  <defs>
    <linearGradient id="slBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6e92ff"/>
      <stop offset="100%" stop-color="#2d3663"/>
    </linearGradient>
    <filter id="slShadow" x="-25%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="4" dy="8" stdDeviation="9" flood-color="#2d3663" flood-opacity=".16"/>
    </filter>
    <marker id="slTip" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#6e92ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <circle cx="262" cy="210" r="196" fill="#e6eefa"/>

  <!-- Las hojas de honorarios, cada una por su lado -->
  <g transform="rotate(-7 124 196)">
    <g filter="url(#slShadow)">
      <path d="M48 92 L200 92 L200 300 L48 300 Z" fill="#eef3fc" transform="rotate(9 124 196)"/>
    </g>
    <path d="M48 92 L200 92 L200 300 L48 300 Z" fill="#eef3fc" stroke="#d8e1f0"
          stroke-width="1.5" transform="rotate(9 124 196)"/>
    <path d="M48 92 L200 92 L200 300 L48 300 Z" fill="#f8fafe" stroke="#d8e1f0"
          stroke-width="1.5" transform="rotate(-6 124 196)"/>
    <g filter="url(#slShadow)">
      <path d="M48 92 L170 92 L200 122 L200 300 L48 300 Z" fill="#fff"/>
    </g>
    <path d="M48 92 L170 92 L200 122 L200 300 L48 300 Z" fill="none" stroke="#d3dcee" stroke-width="1.5"/>
    <path d="M170 92 L170 122 L200 122 Z" fill="#e6eefa" stroke="#d3dcee" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="66" y="114" width="60" height="10" rx="2" fill="#2d3663" opacity=".75"/>
    <!-- Actividad y su importe, línea a línea -->
    <g fill="#dbe2f0">
      <rect x="66" y="144" width="52" height="7" rx="1.5"/>
      <rect x="66" y="164" width="64" height="7" rx="1.5"/>
      <rect x="66" y="184" width="44" height="7" rx="1.5"/>
      <rect x="66" y="204" width="58" height="7" rx="1.5"/>
      <rect x="152" y="144" width="32" height="7" rx="1.5"/>
      <rect x="152" y="164" width="32" height="7" rx="1.5"/>
      <rect x="152" y="184" width="32" height="7" rx="1.5"/>
      <rect x="152" y="204" width="32" height="7" rx="1.5"/>
    </g>
    <!-- Cuentas hechas al margen -->
    <g stroke="#9fb3dd" stroke-width="1.6" stroke-linecap="round" opacity=".85">
      <path d="M70 228 L104 228"/>
      <path d="M70 240 L92 240"/>
      <path d="M118 226 L118 246"/>
    </g>
    <line x1="66" y1="258" x2="184" y2="258" stroke="#c3d2ef" stroke-width="1.5"/>
    <rect x="144" y="266" width="40" height="13" rx="2" fill="#2d3663" opacity=".75"/>
  </g>

  <path d="M222 206 L276 206" fill="none" stroke="#6e92ff" stroke-width="3.5"
        stroke-linecap="round" marker-end="url(#slTip)"/>

  <!-- La liquidación por profesional, al día -->
  <rect x="292" y="84" width="196" height="244" rx="16" fill="#fff" stroke="#dbe2f0" stroke-width="2"/>
  <line x1="292" y1="122" x2="488" y2="122" stroke="#dbe2f0" stroke-width="2"/>
  <g fill="#c3d2ef">
    <circle cx="312" cy="103" r="5"/>
    <circle cx="330" cy="103" r="5"/>
    <circle cx="348" cy="103" r="5"/>
  </g>
  <!-- Un profesional por fila, con lo que le corresponde -->
  <g>
    <circle cx="326" cy="156" r="11" fill="#e6eefa"/>
    <rect x="346" y="146" width="66" height="8" rx="4" fill="#c3d2ef"/>
    <rect x="346" y="159" width="44" height="6" rx="3" fill="#dbe2f0"/>
    <rect x="424" y="151" width="40" height="9" rx="4.5" fill="#dbe2f0"/>

    <circle cx="326" cy="196" r="11" fill="#e6eefa"/>
    <rect x="346" y="186" width="54" height="8" rx="4" fill="#c3d2ef"/>
    <rect x="346" y="199" width="38" height="6" rx="3" fill="#dbe2f0"/>
    <rect x="424" y="191" width="40" height="9" rx="4.5" fill="#dbe2f0"/>
  </g>
  <!-- El que acaba de cuadrarse -->
  <rect x="304" y="222" width="172" height="48" rx="10" fill="url(#slBar)"/>
  <circle cx="330" cy="246" r="12" fill="#fff" opacity=".9"/>
  <rect x="352" y="236" width="60" height="8" rx="4" fill="#fff" opacity=".95"/>
  <rect x="352" y="249" width="40" height="6" rx="3" fill="#fff" opacity=".6"/>
  <circle cx="449" cy="246" r="13" fill="#fff"/>
  <path d="M443 246 l4 4 l8 -9" stroke="#2d3663" stroke-width="2.4" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#eef3fc">
    <rect x="312" y="284" width="156" height="12" rx="6"/>
    <rect x="312" y="304" width="104" height="12" rx="6"/>
  </g>
</svg>
