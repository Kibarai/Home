{%- comment -%}
  Sector construcción: un parte de obra escrito a mano con una foto grapada,
  y el coste de la obra ya al día dentro del sistema.
{%- endcomment -%}
<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="{{ site.data.i18n[page.lang].i18n.illustration_alt_construccion }}">
  <defs>
    <linearGradient id="cnBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6e92ff"/>
      <stop offset="100%" stop-color="#2d3663"/>
    </linearGradient>
    <filter id="cnShadow" x="-25%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="4" dy="8" stdDeviation="9" flood-color="#2d3663" flood-opacity=".16"/>
    </filter>
    <marker id="cnTip" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#6e92ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <circle cx="262" cy="210" r="196" fill="#e6eefa"/>

  <!-- El parte de obra, escrito a mano y con su foto -->
  <g transform="rotate(-7 124 196)">
    <g filter="url(#cnShadow)">
      <path d="M48 92 L200 92 L200 300 L48 300 Z" fill="#eef3fc" transform="rotate(7 124 196)"/>
    </g>
    <path d="M48 92 L200 92 L200 300 L48 300 Z" fill="#eef3fc" stroke="#d8e1f0"
          stroke-width="1.5" transform="rotate(7 124 196)"/>
    <path d="M48 92 L200 92 L200 300 L48 300 Z" fill="#f8fafe" stroke="#d8e1f0"
          stroke-width="1.5" transform="rotate(-3.5 124 196)"/>
    <g filter="url(#cnShadow)">
      <path d="M48 92 L170 92 L200 122 L200 300 L48 300 Z" fill="#fff"/>
    </g>
    <path d="M48 92 L170 92 L200 122 L200 300 L48 300 Z" fill="none" stroke="#d3dcee" stroke-width="1.5"/>
    <path d="M170 92 L170 122 L200 122 Z" fill="#e6eefa" stroke="#d3dcee" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="66" y="114" width="60" height="10" rx="2" fill="#2d3663" opacity=".75"/>
    <!-- Lo escrito a mano en obra -->
    <g fill="#dbe2f0">
      <rect x="66" y="142" width="104" height="6" rx="1.5"/>
      <rect x="66" y="156" width="88" height="6" rx="1.5"/>
      <rect x="66" y="170" width="112" height="6" rx="1.5"/>
      <rect x="66" y="184" width="72" height="6" rx="1.5"/>
    </g>
    <!-- La foto grapada -->
    <g transform="rotate(5 140 232)">
      <rect x="108" y="200" width="68" height="52" rx="2" fill="#eef3fc" stroke="#c3d2ef" stroke-width="1.5"/>
      <path d="M116 242 L132 222 L144 236 L152 228 L168 242 Z" fill="#c3d2ef"/>
      <circle cx="126" cy="214" r="5" fill="#dbe2f0"/>
      <path d="M134 198 L146 203" stroke="#9fb3dd" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g fill="#dbe2f0">
      <rect x="66" y="264" width="46" height="6" rx="1.5"/>
      <rect x="66" y="276" width="62" height="6" rx="1.5"/>
    </g>
  </g>

  <path d="M222 206 L276 206" fill="none" stroke="#6e92ff" stroke-width="3.5"
        stroke-linecap="round" marker-end="url(#cnTip)"/>

  <!-- El coste de la obra, al día -->
  <rect x="292" y="84" width="196" height="244" rx="16" fill="#fff" stroke="#dbe2f0" stroke-width="2"/>
  <line x1="292" y1="122" x2="488" y2="122" stroke="#dbe2f0" stroke-width="2"/>
  <g fill="#c3d2ef">
    <circle cx="312" cy="103" r="5"/>
    <circle cx="330" cy="103" r="5"/>
    <circle cx="348" cy="103" r="5"/>
  </g>
  <!-- El importe de la obra, consultable ahora -->
  <rect x="312" y="140" width="156" height="56" rx="10" fill="#e6eefa"/>
  <rect x="328" y="156" width="78" height="12" rx="6" fill="#2d3663" opacity=".6"/>
  <rect x="328" y="174" width="50" height="7" rx="3.5" fill="#c3d2ef"/>
  <g>
    <rect x="312" y="208" width="60" height="8" rx="4" fill="#c3d2ef"/>
    <rect x="404" y="208" width="42" height="8" rx="4" fill="#dbe2f0"/>
    <rect x="312" y="230" width="48" height="8" rx="4" fill="#c3d2ef"/>
    <rect x="404" y="230" width="42" height="8" rx="4" fill="#dbe2f0"/>
  </g>
  <!-- La partida que acaba de imputarse -->
  <rect x="304" y="252" width="172" height="44" rx="10" fill="url(#cnBar)"/>
  <rect x="322" y="266" width="64" height="8" rx="4" fill="#fff" opacity=".95"/>
  <rect x="322" y="279" width="40" height="6" rx="3" fill="#fff" opacity=".6"/>
  <circle cx="449" cy="274" r="13" fill="#fff"/>
  <path d="M443 274 l4 4 l8 -9" stroke="#2d3663" stroke-width="2.4" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
