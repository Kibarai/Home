{%- comment -%}
  Sector seguridad privada: un cuadrante en papel con un hueco sin cubrir, y el
  mismo cuadrante ya resuelto dentro del sistema. Sin texto, no hay que
  traducir la imagen.
{%- endcomment -%}
<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="{{ site.data.i18n[page.lang].i18n.illustration_alt_seguridad_privada }}">
  <defs>
    <linearGradient id="sgBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6e92ff"/>
      <stop offset="100%" stop-color="#2d3663"/>
    </linearGradient>
    <filter id="sgShadow" x="-25%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="4" dy="8" stdDeviation="9" flood-color="#2d3663" flood-opacity=".16"/>
    </filter>
    <marker id="sgTip" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#6e92ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <circle cx="262" cy="210" r="196" fill="#e6eefa"/>

  <!-- El cuadrante en papel: rehecho, tachado y con un hueco -->
  <g transform="rotate(-7 124 196)">
    <g filter="url(#sgShadow)">
      <path d="M48 92 L200 92 L200 300 L48 300 Z" fill="#eef3fc" transform="rotate(6 124 196)"/>
    </g>
    <path d="M48 92 L200 92 L200 300 L48 300 Z" fill="#eef3fc" stroke="#d8e1f0"
          stroke-width="1.5" transform="rotate(6 124 196)"/>
    <path d="M48 92 L200 92 L200 300 L48 300 Z" fill="#f8fafe" stroke="#d8e1f0"
          stroke-width="1.5" transform="rotate(-3.5 124 196)"/>
    <g filter="url(#sgShadow)">
      <path d="M48 92 L170 92 L200 122 L200 300 L48 300 Z" fill="#fff"/>
    </g>
    <path d="M48 92 L170 92 L200 122 L200 300 L48 300 Z" fill="none" stroke="#d3dcee" stroke-width="1.5"/>
    <path d="M170 92 L170 122 L200 122 Z" fill="#e6eefa" stroke="#d3dcee" stroke-width="1.5" stroke-linejoin="round"/>

    <rect x="66" y="114" width="58" height="10" rx="2" fill="#2d3663" opacity=".75"/>

    <!-- Cabecera de días -->
    <g fill="#c3d2ef">
      <rect x="66" y="134" width="26" height="6" rx="1.5"/>
      <rect x="98" y="134" width="26" height="6" rx="1.5"/>
      <rect x="130" y="134" width="26" height="6" rx="1.5"/>
      <rect x="162" y="134" width="26" height="6" rx="1.5"/>
    </g>

    <!-- Turnos asignados -->
    <g fill="#dbe2f0">
      <rect x="66" y="150" width="26" height="16" rx="2"/>
      <rect x="98" y="150" width="26" height="16" rx="2"/>
      <rect x="130" y="150" width="26" height="16" rx="2"/>
      <rect x="162" y="150" width="26" height="16" rx="2"/>
      <rect x="66" y="172" width="26" height="16" rx="2"/>
      <rect x="98" y="172" width="26" height="16" rx="2"/>
      <rect x="162" y="172" width="26" height="16" rx="2"/>
      <rect x="66" y="194" width="26" height="16" rx="2"/>
      <rect x="98" y="194" width="26" height="16" rx="2"/>
      <rect x="130" y="194" width="26" height="16" rx="2"/>
      <rect x="162" y="194" width="26" height="16" rx="2"/>
      <rect x="66" y="216" width="26" height="16" rx="2"/>
      <rect x="130" y="216" width="26" height="16" rx="2"/>
      <rect x="162" y="216" width="26" height="16" rx="2"/>
    </g>

    <!-- El hueco: nadie cubre ese turno -->
    <rect x="130" y="172" width="26" height="16" rx="2" fill="none"
          stroke="#2d3663" stroke-width="1.8" stroke-dasharray="4 3" opacity=".65"/>

    <!-- Tachones de haberlo rehecho tres veces -->
    <g stroke="#9fb3dd" stroke-width="1.6" stroke-linecap="round" opacity=".9">
      <path d="M100 218 L122 230"/>
      <path d="M122 218 L100 230"/>
      <path d="M164 196 L186 208"/>
    </g>
  </g>

  <!-- Entra al sistema -->
  <path d="M222 206 L276 206" fill="none" stroke="#6e92ff" stroke-width="3.5"
        stroke-linecap="round" marker-end="url(#sgTip)"/>

  <!-- El mismo cuadrante, ya cubierto -->
  <rect x="292" y="84" width="196" height="244" rx="16" fill="#fff" stroke="#dbe2f0" stroke-width="2"/>
  <line x1="292" y1="122" x2="488" y2="122" stroke="#dbe2f0" stroke-width="2"/>
  <g fill="#c3d2ef">
    <circle cx="312" cy="103" r="5"/>
    <circle cx="330" cy="103" r="5"/>
    <circle cx="348" cy="103" r="5"/>
  </g>

  <g fill="#c3d2ef">
    <rect x="312" y="142" width="28" height="6" rx="1.5"/>
    <rect x="346" y="142" width="28" height="6" rx="1.5"/>
    <rect x="380" y="142" width="28" height="6" rx="1.5"/>
    <rect x="414" y="142" width="28" height="6" rx="1.5"/>
  </g>
  <g fill="#e6eefa">
    <rect x="312" y="158" width="28" height="18" rx="3"/>
    <rect x="346" y="158" width="28" height="18" rx="3"/>
    <rect x="380" y="158" width="28" height="18" rx="3"/>
    <rect x="414" y="158" width="28" height="18" rx="3"/>
    <rect x="312" y="182" width="28" height="18" rx="3"/>
    <rect x="346" y="182" width="28" height="18" rx="3"/>
    <rect x="414" y="182" width="28" height="18" rx="3"/>
    <rect x="312" y="206" width="28" height="18" rx="3"/>
    <rect x="346" y="206" width="28" height="18" rx="3"/>
    <rect x="380" y="206" width="28" height="18" rx="3"/>
    <rect x="414" y="206" width="28" height="18" rx="3"/>
    <rect x="312" y="230" width="28" height="18" rx="3"/>
    <rect x="346" y="230" width="28" height="18" rx="3"/>
    <rect x="380" y="230" width="28" height="18" rx="3"/>
    <rect x="414" y="230" width="28" height="18" rx="3"/>
  </g>

  <!-- El hueco, cubierto y confirmado -->
  <rect x="380" y="182" width="28" height="18" rx="3" fill="url(#sgBar)"/>
  <path d="M387 191 l4 4 l8 -9" stroke="#fff" stroke-width="2.4" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Quien puede cubrirlo -->
  <g fill="#eef3fc">
    <rect x="312" y="268" width="130" height="12" rx="6"/>
    <rect x="312" y="288" width="96" height="12" rx="6"/>
  </g>
  <circle cx="455" cy="274" r="13" fill="#2d3663"/>
  <path d="M449 274 l4 4 l8 -9" stroke="#fff" stroke-width="2.4" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
