{%- comment -%}
  Sector restauración: una hoja de escandallo con precios tachados y reescritos a mano,
  y el coste del plato ya recalculado dentro del sistema.
{%- endcomment -%}
<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="{{ site.data.i18n[page.lang].i18n.illustration_alt_restauracion }}">
  <defs>
    <linearGradient id="rsBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6e92ff"/>
      <stop offset="100%" stop-color="#2d3663"/>
    </linearGradient>
    <filter id="rsShadow" x="-25%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="4" dy="8" stdDeviation="9" flood-color="#2d3663" flood-opacity=".16"/>
    </filter>
    <marker id="rsTip" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#6e92ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <circle cx="262" cy="210" r="196" fill="#e6eefa"/>

  <!-- El escandallo en papel, con los precios corregidos encima -->
  <g transform="rotate(-7 124 196)">
    <g filter="url(#rsShadow)">
      <path d="M48 92 L200 92 L200 300 L48 300 Z" fill="#eef3fc" transform="rotate(6 124 196)"/>
    </g>
    <path d="M48 92 L200 92 L200 300 L48 300 Z" fill="#eef3fc" stroke="#d8e1f0"
          stroke-width="1.5" transform="rotate(6 124 196)"/>
    <path d="M48 92 L200 92 L200 300 L48 300 Z" fill="#f8fafe" stroke="#d8e1f0"
          stroke-width="1.5" transform="rotate(-4 124 196)"/>
    <g filter="url(#rsShadow)">
      <path d="M48 92 L170 92 L200 122 L200 300 L48 300 Z" fill="#fff"/>
    </g>
    <path d="M48 92 L170 92 L200 122 L200 300 L48 300 Z" fill="none" stroke="#d3dcee" stroke-width="1.5"/>
    <path d="M170 92 L170 122 L200 122 Z" fill="#e6eefa" stroke="#d3dcee" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="66" y="114" width="60" height="10" rx="2" fill="#2d3663" opacity=".75"/>
    <!-- Ingredientes y sus precios -->
    <g fill="#dbe2f0">
      <rect x="66" y="142" width="58" height="7" rx="1.5"/>
      <rect x="66" y="162" width="48" height="7" rx="1.5"/>
      <rect x="66" y="182" width="62" height="7" rx="1.5"/>
      <rect x="66" y="202" width="42" height="7" rx="1.5"/>
      <rect x="66" y="222" width="54" height="7" rx="1.5"/>
      <rect x="150" y="142" width="34" height="7" rx="1.5"/>
      <rect x="150" y="162" width="34" height="7" rx="1.5"/>
      <rect x="150" y="182" width="34" height="7" rx="1.5"/>
      <rect x="150" y="202" width="34" height="7" rx="1.5"/>
      <rect x="150" y="222" width="34" height="7" rx="1.5"/>
    </g>
    <!-- Dos precios tachados y escritos otra vez encima -->
    <g stroke="#9fb3dd" stroke-width="1.6" stroke-linecap="round">
      <path d="M148 149 L186 141"/>
      <path d="M148 209 L186 201"/>
    </g>
    <g fill="#2d3663" opacity=".55">
      <rect x="152" y="130" width="26" height="6" rx="1.5" transform="rotate(-5 165 133)"/>
      <rect x="152" y="190" width="30" height="6" rx="1.5" transform="rotate(-4 167 193)"/>
    </g>
    <line x1="66" y1="244" x2="184" y2="244" stroke="#c3d2ef" stroke-width="1.5"/>
    <rect x="66" y="254" width="40" height="9" rx="2" fill="#c3d2ef"/>
    <rect x="144" y="252" width="40" height="13" rx="2" fill="#2d3663" opacity=".75"/>
  </g>

  <path d="M222 206 L276 206" fill="none" stroke="#6e92ff" stroke-width="3.5"
        stroke-linecap="round" marker-end="url(#rsTip)"/>

  <!-- El coste del plato, recalculado solo -->
  <rect x="292" y="84" width="196" height="244" rx="16" fill="#fff" stroke="#dbe2f0" stroke-width="2"/>
  <line x1="292" y1="122" x2="488" y2="122" stroke="#dbe2f0" stroke-width="2"/>
  <g fill="#c3d2ef">
    <circle cx="312" cy="103" r="5"/>
    <circle cx="330" cy="103" r="5"/>
    <circle cx="348" cy="103" r="5"/>
  </g>
  <g fill="#e6eefa">
    <rect x="312" y="142" width="156" height="30" rx="8"/>
    <rect x="312" y="180" width="156" height="30" rx="8"/>
  </g>
  <g fill="#c3d2ef">
    <rect x="326" y="153" width="62" height="8" rx="4"/>
    <rect x="326" y="191" width="48" height="8" rx="4"/>
    <rect x="414" y="153" width="38" height="8" rx="4"/>
    <rect x="414" y="191" width="38" height="8" rx="4"/>
  </g>
  <!-- El plato cuyo coste acaba de subir -->
  <rect x="304" y="218" width="172" height="44" rx="10" fill="url(#rsBar)"/>
  <rect x="326" y="232" width="70" height="8" rx="4" fill="#fff" opacity=".95"/>
  <rect x="326" y="245" width="44" height="6" rx="3" fill="#fff" opacity=".6"/>
  <!-- El coste de ese plato ha subido. Flecha, no triángulo macizo, y con
       aire suficiente para que no se confunda con el check de al lado. -->
  <g stroke="#fff" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".95">
    <path d="M418 249 L418 233"/>
    <path d="M412 239 L418 233 L424 239"/>
  </g>
  <circle cx="452" cy="240" r="13" fill="#fff"/>
  <path d="M446 240 l4 4 l8 -9" stroke="#2d3663" stroke-width="2.4" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#eef3fc">
    <rect x="312" y="276" width="156" height="12" rx="6"/>
    <rect x="312" y="296" width="112" height="12" rx="6"/>
  </g>
</svg>
