{%- comment -%}
  Ilustración del hero: una factura en papel entra sola en el sistema y aparece
  ya registrada y verificada. Sin texto, para no tener que traducirla.
{%- endcomment -%}
<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="{{ site.data.i18n[page.lang].i18n.hero_illustration_alt | default: 'Una factura en papel entra sola en el sistema y aparece registrada y verificada' }}">
  <defs>
    <linearGradient id="kBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6e92ff"/>
      <stop offset="100%" stop-color="#2d3663"/>
    </linearGradient>
    <filter id="kPaperShadow" x="-25%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="4" dy="8" stdDeviation="9" flood-color="#2d3663" flood-opacity=".16"/>
    </filter>
    <marker id="kTip" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#6e92ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <circle cx="262" cy="210" r="196" fill="#e6eefa"/>

  <!-- La factura en papel, tal y como llega.
       Para que lea como papel y no como una tarjeta de interfaz: esquinas
       rectas, sombra proyectada, una esquina doblada y el pliegue del sobre. -->
  <g transform="rotate(-7 124 196)">
    <!-- El taco: tres hojas asomando por detrás, cada una girada lo justo
         para que se vea el canto. Nunca llega una factura sola. -->
    <g filter="url(#kPaperShadow)">
      <path d="M48 92 L200 92 L200 300 L48 300 Z" fill="#eef3fc" transform="rotate(7 124 196)"/>
    </g>
    <path d="M48 92 L200 92 L200 300 L48 300 Z" fill="#eef3fc" stroke="#d8e1f0"
          stroke-width="1.5" transform="rotate(7 124 196)"/>
    <path d="M48 92 L200 92 L200 300 L48 300 Z" fill="#f5f8fd" stroke="#d8e1f0"
          stroke-width="1.5" transform="rotate(-4.5 124 196)"/>
    <path d="M48 92 L200 92 L200 300 L48 300 Z" fill="#fbfcfe" stroke="#d8e1f0"
          stroke-width="1.5" transform="rotate(3 124 196)"/>
    <!-- La de arriba, con la esquina doblada -->
    <g filter="url(#kPaperShadow)">
      <path d="M48 92 L170 92 L200 122 L200 300 L48 300 Z" fill="#fff"/>
    </g>
    <path d="M48 92 L170 92 L200 122 L200 300 L48 300 Z" fill="none" stroke="#d3dcee" stroke-width="1.5"/>
    <path d="M170 92 L170 122 L200 122 Z" fill="#e6eefa" stroke="#d3dcee" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- El pliegue de haber venido en un sobre -->
    <line x1="48" y1="196" x2="200" y2="196" stroke="#2d3663" stroke-width="1" opacity=".07"/>

    <rect x="68" y="116" width="62" height="12" rx="2" fill="#2d3663" opacity=".8"/>
    <rect x="68" y="138" width="38" height="7" rx="1.5" fill="#c3d2ef"/>
    <g fill="#dbe2f0">
      <rect x="68" y="166" width="112" height="7" rx="1.5"/>
      <rect x="68" y="182" width="96" height="7" rx="1.5"/>
      <rect x="68" y="206" width="112" height="7" rx="1.5"/>
      <rect x="68" y="222" width="82" height="7" rx="1.5"/>
    </g>
    <line x1="68" y1="244" x2="180" y2="244" stroke="#c3d2ef" stroke-width="1.5"/>
    <rect x="68" y="256" width="44" height="9" rx="1.5" fill="#c3d2ef"/>
    <rect x="132" y="254" width="48" height="13" rx="2" fill="#2d3663" opacity=".8"/>
  </g>

  <!-- Entra sola -->
  <path d="M222 206 L276 206" fill="none" stroke="#6e92ff" stroke-width="3.5"
        stroke-linecap="round" marker-end="url(#kTip)"/>

  <!-- El sistema, con la factura ya dentro -->
  <rect x="292" y="84" width="196" height="244" rx="16" fill="#fff" stroke="#dbe2f0" stroke-width="2"/>
  <line x1="292" y1="122" x2="488" y2="122" stroke="#dbe2f0" stroke-width="2"/>
  <g fill="#c3d2ef">
    <circle cx="312" cy="103" r="5"/>
    <circle cx="330" cy="103" r="5"/>
    <circle cx="348" cy="103" r="5"/>
  </g>

  <!-- Las que ya estaban -->
  <g>
    <rect x="312" y="142" width="156" height="34" rx="8" fill="#f6f9ff"/>
    <rect x="326" y="154" width="62" height="7" rx="3.5" fill="#c3d2ef"/>
    <rect x="326" y="165" width="40" height="5" rx="2.5" fill="#dbe2f0"/>
    <path d="M440 158 l6 6 l12 -13" stroke="#6e92ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="312" y="186" width="156" height="34" rx="8" fill="#f6f9ff"/>
    <rect x="326" y="198" width="74" height="7" rx="3.5" fill="#c3d2ef"/>
    <rect x="326" y="209" width="48" height="5" rx="2.5" fill="#dbe2f0"/>
    <path d="M440 202 l6 6 l12 -13" stroke="#6e92ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- La que acaba de entrar, resaltada -->
  <rect x="304" y="228" width="172" height="44" rx="10" fill="url(#kBar)"/>
  <rect x="326" y="242" width="68" height="8" rx="4" fill="#fff" opacity=".95"/>
  <rect x="326" y="255" width="44" height="6" rx="3" fill="#fff" opacity=".6"/>
  <circle cx="447" cy="250" r="14" fill="#fff"/>
  <path d="M441 250 l4.5 4.5 l9 -9.5" stroke="#2d3663" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Y las siguientes, en camino -->
  <g fill="#eef3fc">
    <rect x="312" y="284" width="156" height="12" rx="6"/>
    <rect x="312" y="304" width="112" height="12" rx="6"/>
  </g>
</svg>
