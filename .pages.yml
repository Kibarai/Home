# PagesCMS config — https://pagescms.org
# Editar en https://app.pagescms.org tras conectar el repo.
#
# Dos cosas viven aquí:
#   1. "Páginas": cada página del sitio se monta con bloques reordenables.
#      Crear una página nueva es crear un fichero en la carpeta del idioma y
#      elegir sus bloques. No hace falta tocar código.
#   2. "Idiomas del sitio": navegación, URLs, footer, formulario y legales.
#      Añadir un idioma = crear aquí un fichero nuevo y una carpeta en Páginas.

media: assets/uploads

content:
  - name: pages
    label: Páginas
    type: collection
    path: _pages_i18n
    subfolders: true
    filename: '{primary}.md'
    view:
      fields: [title, permalink]
    fields:
      - { name: title, label: Título (pestaña y buscadores), type: string, required: true }
      - { name: description, label: Descripción para buscadores, type: text }
      - { name: permalink, label: URL (debe empezar y acabar en /), type: string, required: true, pattern: '^/.*/$' }
      - { name: form_sector, label: Etiqueta de origen para el formulario, type: string }

      - name: blocks
        label: Bloques de la página
        type: block
        list: true
        blockKey: type
        blocks:
          - name: hero
            label: Cabecera
            fields:
              - { name: eyebrow, label: Antetítulo, type: string }
              - { name: title, label: Titular, type: text, required: true }
              - { name: subtitle, label: Subtítulo, type: text }
              - { name: bullets, label: Puntos destacados, type: string, list: true }
              - { name: cta_primary_label, label: Botón principal — texto, type: string }
              - { name: cta_primary_url, label: Botón principal — URL (vacío = agenda), type: string }
              - { name: cta_secondary_label, label: Botón secundario — texto, type: string }
              - { name: cta_secondary_url, label: Botón secundario — URL, type: string }
              - { name: illustration, label: Mostrar ilustración, type: boolean, default: false }
              - { name: variant, label: Variante, type: select, options: { values: [claro, dark] }, default: claro }

          - name: dolor
            label: Problemas y salidas
            fields:
              - { name: title, label: Título, type: text }
              - { name: intro, label: Entradilla, type: text }
              - name: items
                label: Problemas
                type: object
                list: true
                fields:
                  - { name: title, label: Problema, type: string }
                  - { name: body, label: Descripción, type: text }
                  - { name: salida_prefix, label: Etiqueta de salida, type: string }
                  - { name: salida, label: La salida, type: text }
                  - { name: salida_url, label: Enlace de la salida, type: string }

          - name: cifras
            label: Cifras
            fields:
              - name: items
                label: Cifras
                type: object
                list: true
                fields:
                  - { name: value, label: Número, type: string }
                  - { name: label, label: Etiqueta, type: string }
                  - { name: body, label: Explicación, type: text }

          - name: soluciones
            label: Bloques numerados
            fields:
              - { name: anchor, label: "Ancla (para enlazar con #)", type: string }
              - { name: title, label: Título, type: string }
              - { name: subtitle, label: Subtítulo, type: text }
              - name: items
                label: Elementos
                type: object
                list: true
                fields:
                  - { name: title, label: Título, type: string }
                  - { name: url, label: Enlace, type: string }
                  - { name: body, label: Descripción, type: text }
                  - { name: bullets, label: Puntos, type: string, list: true }
                  - { name: tags, label: Etiquetas, type: string, list: true }

          - name: tarjetas
            label: Cuadrícula de tarjetas
            fields:
              - { name: title, label: Título, type: string }
              - { name: subtitle, label: Subtítulo, type: text }
              - { name: anchor, label: Ancla, type: string }
              - name: items
                label: Tarjetas
                type: object
                list: true
                fields:
                  - { name: title, label: Título, type: string }
                  - { name: body, label: Descripción, type: text }
                  - { name: url, label: Enlace, type: string }
                  - { name: booking, label: Enlazar a la agenda (ignora el enlace de arriba), type: boolean, default: false }
                  - { name: icon, label: Icono, type: select, options: { values: [search, build, grow, compass, code, spark, mail, linkedin] } }

          - name: antes-despues
            label: Antes y después
            fields:
              - { name: eyebrow, label: Antetítulo, type: string }
              - { name: title, label: Título, type: string }
              - { name: antes_label, label: Palabra para "Antes", type: string }
              - name: items
                label: Pares antes/después
                type: object
                list: true
                fields:
                  - { name: antes, label: Situación de partida, type: string }
                  - { name: title, label: Qué cambia, type: string }
                  - { name: body, label: Descripción, type: text }

          - name: comparativa
            label: Tabla comparativa
            fields:
              - { name: title, label: Título, type: string }
              - { name: intro, label: Entradilla, type: text }
              - { name: head, label: Cabeceras de columna, type: string, list: true }
              - name: rows
                label: Filas
                type: object
                list: true
                fields:
                  - { name: cells, label: Celdas (en el mismo orden que las cabeceras), type: string, list: true }

          - name: proceso
            label: Pasos numerados
            fields:
              - { name: title, label: Título, type: string }
              - { name: subtitle, label: Subtítulo, type: text }
              - name: steps
                label: Pasos
                type: object
                list: true
                fields:
                  - { name: label, label: Etiqueta (vacío = se numera solo), type: string }
                  - { name: title, label: Título, type: string }
                  - { name: body, label: Descripción, type: text }
              - { name: cta_label, label: Botón — texto, type: string }
              - { name: cta_url, label: Botón — URL (vacío = agenda), type: string }

          - name: fundador
            label: Fundador
            fields:
              - { name: eyebrow, label: Antetítulo, type: string }
              - { name: title, label: Título, type: string }
              - { name: body, label: Texto (Markdown), type: text }
              - { name: photo, label: Foto, type: image }
              - { name: signature, label: Solo foto a la derecha y ficha bajo el texto, type: boolean, default: false }
              - { name: name, label: Nombre, type: string }
              - { name: role, label: Cargo, type: string }
              - { name: facts, label: Datos de la ficha, type: string, list: true }

          - name: garantias
            label: Garantías
            fields:
              - { name: title, label: Título, type: string }
              - { name: subtitle, label: Subtítulo, type: text }
              - name: items
                label: Garantías
                type: object
                list: true
                fields:
                  - { name: title, label: Título, type: string }
                  - { name: body, label: Descripción, type: text }

          - name: faq
            label: Preguntas frecuentes
            fields:
              - { name: title, label: Título, type: string }
              - name: items
                label: Preguntas
                type: object
                list: true
                fields:
                  - { name: q, label: Pregunta, type: string }
                  - { name: a, label: Respuesta (Markdown), type: text }

          - name: texto
            label: Texto libre
            fields:
              - { name: title, label: Título, type: string }
              - { name: body, label: Contenido, type: rich-text }

          - name: legal
            label: Página legal
            fields:
              - { name: key, label: Cuál, type: select, options: { values: [legal_notice, privacy, cookies] }, required: true }

          - name: cta
            label: Llamada a la acción
            fields:
              - { name: title, label: Título, type: string }
              - { name: body, label: Texto, type: text }
              - { name: button_label, label: Botón — texto (vacío = por defecto), type: string }
              - { name: button_url, label: Botón — URL (vacío = agenda), type: string }
              - { name: notes, label: Apuntes con check, type: string, list: true }
              - { name: form, label: Mostrar formulario, type: boolean, default: false }

  - name: i18n
    label: Idiomas del sitio
    type: collection
    path: _data/i18n
    filename: '{primary}.yml'
    format: yaml
    view:
      fields: [meta.self_name]
    fields:
      - name: meta
        label: Idioma — ajustes
        type: object
        fields:
          - { name: self_name, label: Nombre del idioma (auto-referencial), type: string, required: true }
          - { name: html_lang, label: Código HTML lang (ISO 639-1), type: string, required: true }
          - { name: browser_codes, label: Códigos que detecta el navegador, type: string, list: true }

      - name: urls
        label: URLs principales (deben empezar por /<idioma>/)
        type: object
        fields:
          - { name: home, label: Home, type: string, required: true }
          - { name: solutions, label: Soluciones, type: string, required: true }
          - { name: sectors, label: Sectores, type: string, required: true }
          - { name: about, label: Sobre, type: string, required: true }
          - { name: contact, label: Contacto, type: string, required: true }
          - { name: legal_notice, label: Aviso legal, type: string, required: true }
          - { name: privacy, label: Privacidad, type: string, required: true }
          - { name: cookies, label: Política de cookies, type: string, required: true }
          - { name: news, label: Blog — índice (desactivado), type: string }
          - { name: news_prefix, label: Blog — prefijo de posts (desactivado), type: string }

      - name: brand
        label: Marca
        type: object
        fields:
          - { name: name, label: Nombre, type: string }
          - { name: tagline, label: Tagline, type: string }

      - name: nav
        label: Navegación
        type: object
        list: true
        fields:
          - { name: label, label: Etiqueta, type: string }
          - { name: url, label: URL, type: string }
          - { name: primary, label: Botón destacado, type: boolean, default: false }
          - name: children
            label: Submenú (vacío = sin desplegable)
            type: object
            list: true
            fields:
              - { name: label, label: Etiqueta, type: string }
              - { name: url, label: URL, type: string }

      - name: contact
        label: Contacto y agenda
        type: object
        fields:
          - { name: email, label: Email, type: string }
          - { name: linkedin, label: LinkedIn URL, type: string }
          - { name: booking_url, label: "URL de la agenda (Bookings, Cal.com…)", type: string }
          - { name: booking_label, label: Texto por defecto del botón de agenda, type: string }
          - { name: form_endpoint, label: Endpoint del formulario (vacío = no se muestra), type: string }

      - name: form
        label: Formulario de diagnóstico
        type: object
        fields:
          - { name: title, label: Título, type: string }
          - { name: subtitle, label: Subtítulo, type: text }
          - { name: subject, label: Asunto del email, type: string }
          - { name: honeypot, label: Etiqueta del campo trampa, type: string }
          - { name: name, label: Etiqueta "Nombre", type: string }
          - { name: company, label: Etiqueta "Empresa", type: string }
          - { name: email, label: Etiqueta "Email", type: string }
          - { name: phone, label: Etiqueta "Teléfono", type: string }
          - { name: submit, label: Texto del botón, type: string }
          - { name: legal_prefix, label: Texto antes del enlace legal, type: string }
          - { name: legal_link, label: Texto del enlace legal, type: string }
          - { name: response, label: Nota de respuesta, type: string }

      - name: cookies_banner
        label: Banner de cookies
        type: object
        fields:
          - { name: enabled, label: Mostrar banner, type: boolean, default: true }
          - { name: message, label: Mensaje, type: text }
          - { name: accept_label, label: Texto botón aceptar, type: string }
          - { name: learn_more_label, label: Texto enlace, type: string }
          - { name: learn_more_url, label: URL enlace, type: string }

      - name: footer
        label: Pie de página
        type: object
        fields:
          - name: columns
            label: Columnas
            type: object
            list: true
            fields:
              - { name: heading, label: Título de columna, type: string }
              - name: links
                label: Enlaces
                type: object
                list: true
                fields:
                  - { name: label, label: Etiqueta, type: string }
                  - { name: url, label: URL, type: string }
          - name: legal_links
            label: Enlaces legales
            type: object
            list: true
            fields:
              - { name: label, label: Etiqueta, type: string }
              - { name: url, label: URL, type: string }
          - { name: copyright, label: Texto de copyright, type: string }

      - name: legal_data
        label: Datos legales (RGPD / LSSI)
        type: object
        fields:
          - { name: owner_name, label: Titular, type: string }
          - { name: owner_type, label: Tipo, type: select, options: { values: [empresa, autónomo, company, individual] } }
          - { name: nif, label: NIF / CIF, type: string }
          - { name: address, label: Domicilio postal, type: text }
          - { name: activity, label: Actividad, type: string }
          - { name: registry, label: Datos registrales, type: text }
          - { name: phone, label: Teléfono, type: string }
          - { name: hosting_provider, label: Proveedor de alojamiento, type: text }
          - { name: analytics, label: ¿Usa analytics?, type: boolean, default: false }
          - { name: analytics_name, label: Nombre del analytics, type: string }
          - { name: last_updated, label: Última actualización, type: date }

      - name: legal_pages
        label: Páginas legales
        type: object
        fields:
          - name: legal_notice
            label: Aviso legal
            type: object
            fields:
              - { name: title, label: Título, type: string }
              - { name: lede, label: Introducción, type: text }
              - name: sections
                label: Secciones
                type: object
                list: true
                fields:
                  - { name: heading, label: Encabezado, type: string }
                  - { name: body, label: Cuerpo (Markdown), type: text }
          - name: privacy
            label: Privacidad
            type: object
            fields:
              - { name: title, label: Título, type: string }
              - { name: lede, label: Introducción, type: text }
              - name: sections
                label: Secciones
                type: object
                list: true
                fields:
                  - { name: heading, label: Encabezado, type: string }
                  - { name: body, label: Cuerpo (Markdown), type: text }
          - name: cookies
            label: Cookies
            type: object
            fields:
              - { name: title, label: Título, type: string }
              - { name: lede, label: Introducción, type: text }
              - name: sections
                label: Secciones
                type: object
                list: true
                fields:
                  - { name: heading, label: Encabezado, type: string }
                  - { name: body, label: Cuerpo (Markdown), type: text }

      - name: i18n
        label: Textos de interfaz
        type: object
        fields:
          - { name: back_label, label: "Volver", type: string }
          - { name: last_updated_label, label: "Última actualización", type: string }
          - { name: skip_link, label: "Ir al contenido", type: string }
          - { name: nav_aria, label: "aria-label del nav", type: string }
          - { name: open_menu, label: "Abrir menú", type: string }
          - { name: close_menu, label: "Cerrar menú", type: string }
          - { name: lang_dropdown_label, label: "Etiqueta selector idioma", type: string }
          - { name: empty_posts_lead, label: "Mensaje sin posts", type: string }
          - { name: hero_illustration_alt, label: "Texto alternativo de la ilustración", type: string }

  # Blog desactivado: no hay entradas y no aparece en el menú. La colección se
  # mantiene para poder reactivarlo creando un post, sin tocar código.
  - name: posts
    label: Blog (desactivado)
    type: collection
    path: _posts
    subfolders: true
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      fields: [title, date]
      sort: [-date]
    fields:
      - { name: title, label: Título, type: string, required: true }
      - { name: subtitle, label: Subtítulo, type: string }
      - { name: date, label: Fecha, type: date, required: true }
      - { name: author, label: Autor, type: string }
      - { name: cover, label: Imagen destacada, type: image }
      - { name: tags, label: Etiquetas, type: string, list: true }
      - { name: body, label: Contenido, type: rich-text }
